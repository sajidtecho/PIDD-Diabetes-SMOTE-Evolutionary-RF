<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>

    <!-- Node Gradient Base -->
    <linearGradient id="node-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Node Glow Gradients -->
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Filters -->
    <filter id="p-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes flowDash {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.2)); }
        50% { transform: scale(1.02); filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6)); }
      }
      @keyframes signalDot {
        0% { offset-distance: 0%; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      .flow-line {
        stroke-dasharray: 6 4;
        animation: flowDash 1.2s linear infinite;
      }
      .node-card {
        transform-origin: center;
        transition: all 0.3s ease;
      }
      .p-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #f8fafc;
      }
      .p-desc {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 400;
        font-size: 10.5px;
        fill: #94a3b8;
      }
      .p-tag {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 9px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="360" rx="16" fill="url(#p-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Animated Connectors (Row 1 to Row 2) -->
  <!-- Top Row Connectors -->
  <path class="flow-line" d="M 230 100 L 275 100" stroke="#0ea5e9" stroke-width="2.5" fill="none" />
  <path class="flow-line" d="M 465 100 L 510 100" stroke="#8b5cf6" stroke-width="2.5" fill="none" />
  <path class="flow-line" d="M 700 100 L 745 100" stroke="#10b981" stroke-width="2.5" fill="none" />

  <!-- Corner turn down to Row 2 -->
  <path class="flow-line" d="M 835 145 L 835 200 L 835 245" stroke="#10b981" stroke-width="2.5" fill="none" />
  
  <!-- Bottom Row Connectors (Right to Left flow) -->
  <path class="flow-line" d="M 745 270 L 700 270" stroke="#f59e0b" stroke-width="2.5" fill="none" />
  <path class="flow-line" d="M 510 270 L 465 270" stroke="#38bdf8" stroke-width="2.5" fill="none" />
  <path class="flow-line" d="M 275 270 L 230 270" stroke="#34d399" stroke-width="2.5" fill="none" />

  <!-- ================= ROW 1 NODES ================= -->

  <!-- NODE 1: PIDD Ingestion -->
  <g transform="translate(40, 55)" class="node-card">
    <rect width="190" height="90" rx="10" fill="url(#node-base)" stroke="#0ea5e9" stroke-width="1.4" />
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#0369a1" opacity="0.3" />
    <text x="26" y="31" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">1</text>
    <text x="48" y="24" fill="#38bdf8" class="p-tag">RAW DATASET</text>
    <text x="48" y="38" class="p-title">PIDD Ingestion</text>
    <text x="14" y="62" class="p-desc">768 Patients • 8 Predictors</text>
    <text x="14" y="78" class="p-desc">Outcome: 500 Neg / 268 Pos</text>
  </g>

  <!-- NODE 2: Zero-Imputation -->
  <g transform="translate(275, 55)" class="node-card">
    <rect width="190" height="90" rx="10" fill="url(#node-base)" stroke="#8b5cf6" stroke-width="1.4" />
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#6d28d9" opacity="0.3" />
    <text x="26" y="31" fill="#a78bfa" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">2</text>
    <text x="48" y="24" fill="#c084fc" class="p-tag">CLEANSING</text>
    <text x="48" y="38" class="p-title">Median Imputation</text>
    <text x="14" y="62" class="p-desc">Replace 0s in Glucose, BP,</text>
    <text x="14" y="78" class="p-desc">Insulin, Skin &amp; BMI signals</text>
  </g>

  <!-- NODE 3: Stratified 3-Way Split -->
  <g transform="translate(510, 55)" class="node-card">
    <rect width="190" height="90" rx="10" fill="url(#node-base)" stroke="#6366f1" stroke-width="1.4" />
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#4338ca" opacity="0.3" />
    <text x="26" y="31" fill="#818cf8" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">3</text>
    <text x="48" y="24" fill="#818cf8" class="p-tag">PARTITIONING</text>
    <text x="48" y="38" class="p-title">3-Way Stratified Split</text>
    <text x="14" y="62" class="p-desc">Train (60%) • Val (20%)</text>
    <text x="14" y="78" class="p-desc">Strict Holdout Test (20%)</text>
  </g>

  <!-- NODE 4: SMOTE Synthesizer -->
  <g transform="translate(745, 55)" class="node-card">
    <rect width="180" height="90" rx="10" fill="url(#node-base)" stroke="#10b981" stroke-width="1.4" />
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#047857" opacity="0.3" />
    <text x="26" y="31" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">4</text>
    <text x="48" y="24" fill="#34d399" class="p-tag">RESAMPLING</text>
    <text x="48" y="38" class="p-title">SMOTE Balancing</text>
    <text x="14" y="62" class="p-desc">Synthesize minority class</text>
    <text x="14" y="78" class="p-desc">Applied strictly to Train only</text>
  </g>

  <!-- ================= ROW 2 NODES (Flowing Left) ================= -->

  <!-- NODE 5: Genetic Algorithm Optimizer -->
  <g transform="translate(745, 225)" class="node-card">
    <rect width="180" height="90" rx="10" fill="url(#node-base)" stroke="#f59e0b" stroke-width="1.4" />
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#b45309" opacity="0.3" />
    <text x="26" y="31" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">5</text>
    <text x="48" y="24" fill="#fbbf24" class="p-tag">OPTIMIZATION</text>
    <text x="48" y="38" class="p-title">Genetic Algorithm</text>
    <text x="14" y="62" class="p-desc">Feature Mask + Tree Tuning</text>
    <text x="14" y="78" class="p-desc">Evaluated on Validation Set</text>
  </g>

  <!-- NODE 6: Random Forest Ensemble -->
  <g transform="translate(510, 225)" class="node-card">
    <rect width="190" height="90" rx="10" fill="url(#node-base)" stroke="#06b6d4" stroke-width="1.4" />
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#0891b2" opacity="0.3" />
    <text x="26" y="31" fill="#22d3ee" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">6</text>
    <text x="48" y="24" fill="#22d3ee" class="p-tag">CLASSIFIER</text>
    <text x="48" y="38" class="p-title">Random Forest (300)</text>
    <text x="14" y="62" class="p-desc">Ensemble Bootstrap Forest</text>
    <text x="14" y="78" class="p-desc">High variance suppression</text>
  </g>

  <!-- NODE 7: Threshold Tuning -->
  <g transform="translate(275, 225)" class="node-card">
    <rect width="190" height="90" rx="10" fill="url(#node-base)" stroke="#38bdf8" stroke-width="1.4" />
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#0284c7" opacity="0.3" />
    <text x="26" y="31" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">7</text>
    <text x="48" y="24" fill="#38bdf8" class="p-tag">CALIBRATION</text>
    <text x="48" y="38" class="p-title">Threshold Tuning</text>
    <text x="14" y="62" class="p-desc">Optimal Cutoff τ = 0.42</text>
    <text x="14" y="78" class="p-desc">Maximizes clinical F1 / Recall</text>
  </g>

  <!-- NODE 8: Final Diagnostic Inference -->
  <g transform="translate(40, 225)" class="node-card">
    <rect width="190" height="90" rx="10" fill="url(#node-base)" stroke="#10b981" stroke-width="1.8" filter="url(#p-glow)" />
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#059669" opacity="0.4" />
    <text x="26" y="31" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">✓</text>
    <text x="48" y="24" fill="#34d399" class="p-tag">EVALUATION</text>
    <text x="48" y="38" class="p-title">Diagnostic Results</text>
    <text x="14" y="62" class="p-desc" fill="#34d399" font-weight="700">86.36% Acc • 89.22% AUC</text>
    <text x="14" y="78" class="p-desc">85.19% Sensitivity Rate</text>
  </g>
</svg>
